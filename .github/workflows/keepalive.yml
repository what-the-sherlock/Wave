name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days with no activity. This
# pings the REST API every 3 days so the project never gets there —
# doubles as a liveness canary for the project itself.
# docs/free-tier-plan.md §2.

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets not set yet — skipping." >&2
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Response status: $status"
          if [ "$status" -ge 500 ]; then
            echo "Supabase project appears to be down." >&2
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
